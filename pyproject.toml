[project]
name = "probability-simulations"
version = "1.0.0"
description = "Monte Carlo answers to three questions with known answers, and an exam-score analysis"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
simulations = "simulations.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["simulations*"]
